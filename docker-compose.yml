services:
  bot:
    build: .
    container_name: study-bot
    restart: unless-stopped        # сам перезапускается после сбоя и после перезагрузки сервера
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.db
    volumes:
      - ./data:/app/data           # база лежит на диске сервера, а не внутри контейнера
